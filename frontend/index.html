<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover`: the bottom tab bar stands on the home indicator's safe area, read through env() -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0a0f" />
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>%BRAND_NAME%</title>
    <style>
      /* The page colour before the stylesheet arrives, so a dark cabinet never flashes white */
      html {
        background: #0b0a0f;
        color-scheme: dark;
      }
      /* The mark holds the screen while the cabinet loads its configuration; it only shows up when that
         takes long enough to notice, so a fast start never flickers */
      .boot {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        animation: boot-in 240ms cubic-bezier(0.23, 1, 0.32, 1) 400ms backwards;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" aria-label="Loading %BRAND_NAME%" role="status">
        %BRAND_MARK%
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
