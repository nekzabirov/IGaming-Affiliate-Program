spring.application.name=affiliate-app
# A deployment's own defaults, when it ships one: values in that file win over the ones below, env variables still
# win over both. Without it every default below applies.
spring.config.import=optional:classpath:operator.properties
spring.main.banner-mode=off
# Boot's own "Starting/Started" lines carry no `event` key; the app logs app.started and schema.migrated instead.
spring.main.log-startup-info=false

# Requests, the broker listener and the scheduler run on virtual threads; bcrypt is bounded on its own
# (PasswordHasher), because a virtual thread busy hashing would pin its carrier.
spring.threads.virtual.enabled=true

# The public port: the SPA and /api. Actuator never answers here (management.server.port below).
server.port=${SERVER_PORT:8080}
# X-Forwarded-* are trusted only when a proxy in front of the app sets them (FORWARD_HEADERS_STRATEGY=framework):
# reached directly, a client could otherwise choose its own address.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.shutdown=graceful
server.error.whitelabel.enabled=false

# DB_URL is the host part only (jdbc:postgresql://host:port), so one shared database secret can serve several
# apps; DATABASE_NAME makes it this app's database. autosave=conservative lets a statement prepared before the next
# release's Flyway added a column re-prepare instead of failing with "cached plan must not change result type".
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432}/${DATABASE_NAME:affiliate}?reWriteBatchedInserts=true&autosave=conservative
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.pool-name=affiliate-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=3000

# Migrations belong to the `schema` launcher (the migration Job), never to a booting service: two pods starting
# at once would race for the history table. The launcher turns this on.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# Host, port and ssl.enabled, never an amqps:// URI: that one makes the client trust any certificate.
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}
spring.rabbitmq.ssl.enabled=${RABBIT_SSL_ENABLED:false}
# A failed delivery goes to the dead-letter exchange, never back onto the queue it came from.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=${RABBIT_PREFETCH:32}

# Metrics and health on a port of their own: the public port faces the internet, this one never should.
management.server.port=${METRICS_PORT:9464}
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoint.health.show-details=never
# The cabinet keeps serving partners while the broker is away: the listener reconnects by itself and the facts
# wait in the durable queue. A broker outage taking every pod out of the Service would only add an outage.
management.health.rabbit.enabled=false
# The latency buckets. Written as properties: a dotted meter name as a YAML key is split into a path.
management.metrics.distribution.slo.http.server.requests=5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s,30s
management.metrics.distribution.percentiles-histogram.http.server.requests=false

# This app's own settings (AppProperties). A malformed value fails the boot.
# PARTNER_CURRENCY, not BASE_CURRENCY: a name of its own, so a platform-wide BASE_CURRENCY never decides what
# partners are paid in.
affiliate.partner-currency=${PARTNER_CURRENCY:USDT}
affiliate.cpa-min-deposit=${CPA_MIN_DEPOSIT:10}
affiliate.payout-networks=${PAYOUT_NETWORKS:TRC20,ERC20,BEP20,TON}
affiliate.site-url=${SITE_URL:http://localhost:3000}
affiliate.support-telegram-url=${SUPPORT_TELEGRAM_URL:}
affiliate.postback-source-ip=${POSTBACK_SOURCE_IP:}
affiliate.client-ip-header=${CLIENT_IP_HEADER:}
affiliate.promo-manifest-url=${PROMO_MANIFEST_URL:}
affiliate.session.cookie-secure=${SESSION_COOKIE_SECURE:true}
affiliate.session.ttl-days=${SESSION_TTL_DAYS:30}
# The player events exchange (register.events, invoice.events) and the casino events exchange (spin.events, bet.events).
affiliate.events.player-exchange=${PAM_EXCHANGE:pam.events}
affiliate.events.casino-exchange=${CASINO_EXCHANGE:casino.events}
affiliate.events.queue=${EVENT_QUEUE:affiliate.events}
affiliate.currency.host=${CURRENCY_GRPC_HOST:localhost}
affiliate.currency.port=${CURRENCY_GRPC_PORT:443}
affiliate.currency.plaintext=${CURRENCY_GRPC_PLAINTEXT:false}
